# 11 channels. Every channel gets its own angle so the 44 daily videos are not
# near-duplicates of each other (YouTube treats mass-posted repetitive content
# across channels as spam and can terminate all of them together).
#
# Fill youtube_channel_id after running `python -m otd_shorts.cli auth <key>`.
# token_file lives in OTD_SECRETS_DIR. oauth_client is the Google OAuth "Desktop"
# client JSON for the GCP project this channel uploads through (see README on quota).
#
# Posting slots are local times in brand.timezone. Each video is uploaded as
# private with publishAt set to its slot, so YouTube releases it on schedule.
defaults:
  slots: ["08:00", "12:30", "17:00", "21:00"]
  oauth_client: client_secret.json
  engine: avatar_iv
  resolution: 720p
  captions: true

channels:
  - key: otd_system
    name: OTD System
    pillar: system
    persona: "the coach who explains the OTD System itself: process, rules, routine"
    avatar_id: f942dfea6af34790acbafbced2448617   # digital twin, portrait
    avatar_type: avatar
    voice_id: 21f2bae9535f4f75bd67e12ece4aa8e4
    token_file: yt_otd_system.json
    youtube_channel_id: ""
